[tool.ruff]
line-length = 100
target-version = "py311"
src = ["ml"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905"]   # zip(strict=) adds noise; our zips pair columns of the same frame

[tool.ruff.lint.isort]
known-first-party = ["app", "triage_ml"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"**/tests/conftest.py" = ["E402"]   # env vars must be set before the app is imported

[tool.pytest.ini_options]
markers = ["integration: needs a real Postgres (DATABASE_URL)"]
pythonpath = ["ml"]
