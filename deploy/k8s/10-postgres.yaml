apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: triageiq
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      # postgres UID in the alpine image; fsGroup makes the volume writable for it
      securityContext: {runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, fsGroup: 70, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgres
          image: triageiq-postgres:dev
          imagePullPolicy: IfNotPresent
          envFrom: [{secretRef: {name: triageiq-env}}]
          env:
            - {name: POSTGRES_USER, value: triageiq}
            - {name: POSTGRES_DB, value: triageiq}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}   # subdir: the volume root has lost+found
          ports: [{containerPort: 5432}]
          readinessProbe: {exec: {command: [pg_isready, -h, 127.0.0.1, -U, triageiq]}, periodSeconds: 5}
          livenessProbe: {exec: {command: [pg_isready, -h, 127.0.0.1, -U, triageiq]}, initialDelaySeconds: 30, periodSeconds: 20}
          resources:
            requests: {cpu: 100m, memory: 48Mi}
            limits: {cpu: 1000m, memory: 256Mi}   # see the compose comment on shared_buffers
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: triageiq
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
